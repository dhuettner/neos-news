'Waterproof.News:Mixin.ColumnLayout':
  abstract: true
  properties:
    columns:
      type: string
      defaultValue: 'cols3'
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'layout'
          position: 10
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              cols1:
                label: i18n
              cols2:
                label: i18n
              cols3:
                label: i18n
              cols4:
                label: i18n

'Waterproof.News:Document.ArticleIndex':
  superTypes:
    'Neos.Neos:Document': true
    'Waterproof.News:Mixin.ColumnLayout': true
  ui:
    label: i18n
    icon: 'list'
    inspector:
      groups:
        layout:
          label: i18n
          position: 20
  properties:
    itemsPerPage:
      type: integer
      defaultValue: 12
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'layout'
          position: 20
  constraints:
    nodeTypes:
      '*': false
      'Neos.Neos:Document': false
      'Waterproof.News:Document.Article': true
      'Waterproof.News:Document.Feed': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
