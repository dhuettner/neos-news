'Waterproof.News:Document.Article':
  superTypes:
    'Neos.Neos:Document': true
    # Liefert die Property taxonomyReferences samt Sitegeist-Editor mit.
    # Ein eigener Nachbau hätte den Editor verloren und wäre bei jedem
    # Taxonomy-Update nachzuziehen.
    'Sitegeist.Taxonomy:Mixin.TaxonomyReferences': true
  ui:
    label: i18n
    icon: 'newspaper'
    inspector:
      groups:
        article:
          label: i18n
          position: 20
  properties:
    publicationDate:
      type: DateTime
      defaultValue: 'now'
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'article'
          position: 10
          editorOptions:
            format: 'd.m.Y'
    teaserText:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'article'
          position: 20
          editorOptions:
            maxlength: 300
        inlineEditable: false
      validation:
        'Neos.Neos/Validation/StringLengthValidator':
          maximum: 300
    teaserImage:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'article'
          position: 30
    author:
      type: string
      ui:
        label: i18n
        inspector:
          group: 'article'
          position: 40
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
