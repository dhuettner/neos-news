'Waterproof.News:Content.ArticleTeaser':
  superTypes:
    'Neos.Neos:Content': true
    'Waterproof.News:Mixin.ColumnLayout': true
  ui:
    label: i18n
    icon: 'newspaper'
    group: 'structure'
    help:
      message: i18n
    inspector:
      groups:
        teaser:
          label: i18n
          position: 10
        layout:
          label: i18n
          position: 20
  properties:
    headline:
      type: string
      defaultValue: 'Aktuelles'
      ui:
        label: i18n
        inlineEditable: true
    source:
      type: reference
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'teaser'
          position: 10
          editorOptions:
            nodeTypes: ['Waterproof.News:Document.ArticleIndex']
            placeholder: 'Übersichtsseite wählen'
    limit:
      type: integer
      defaultValue: 3
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'teaser'
          position: 20
    showArchiveLink:
      type: boolean
      defaultValue: true
      ui:
        label: i18n
        inspector:
          group: 'teaser'
          position: 30
    archiveLinkTitle:
      type: string
      defaultValue: 'Alle Neuigkeiten'
      ui:
        label: i18n
        inspector:
          group: 'teaser'
          position: 40
